<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            transition: 2s ;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #minimap {
            position: fixed;
            bottom: 10px;
            right: 10px;
            border: 2px solid white;
        }

        #leaderboard {
            position: fixed;
            top: 20px;
            right: 10px;
            background: rgba(0, 0, 0, 0.897);
            color: white;
            padding: 20px;
        }

        #score {
            position: fixed;
            top: 10px;
            left: 10px;
            color: rgb(0, 0, 0);
            font-size: 24px;
        }

        .mobile-only {
            display: none;
        }

        .button {
            display: none;
        }

        #joystick-base {
            display: none;
        }

        #joystick-handle {
            display: none;
        }

        #game-over-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        #game-over-overlay .go-title {
            font-size: 52px;
            font-weight: 900;
            color: #ff4444;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
            animation: pulse 1.5s ease-in-out infinite;
            margin-bottom: 10px;
        }

        #game-over-overlay .go-subtitle {
            font-size: 20px;
            color: #cccccc;
            margin-bottom: 8px;
            animation: slideUp 0.5s ease 0.2s both;
        }

        #game-over-overlay .go-score {
            font-size: 36px;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 30px;
            animation: slideUp 0.5s ease 0.4s both;
        }

        #game-over-overlay .go-btn {
            display: inline-block;
            padding: 14px 40px;
            margin: 8px 10px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: slideUp 0.5s ease 0.6s both;
        }

        #game-over-overlay .go-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        #game-over-overlay .go-btn-try {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #fff;
        }

        #game-over-overlay .go-btn-home {
            background: linear-gradient(135deg, #2979ff, #448aff);
            color: #fff;
        }

        #game-over-overlay .go-btn-contact {
            background: linear-gradient(135deg, #7c4dff, #b388ff);
            color: #fff;
            font-size: 15px;
            padding: 10px 30px;
            margin-top: 10px;
            animation: slideUp 0.5s ease 0.8s both;
        }

        @media only screen and (max-width: 600px) {
            #joystick-base {
                width: 100px;
                height: 100px;
                background-color: rgba(0, 0, 0, 0.5);
                border-radius: 50%;
                position: fixed;
                bottom: 20px;
                left: 20px;
                z-index: 1000;
            }

            .button {
                background-color: #4CAF50;
                border: none;
                color: white;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin: 4px 2px;
                cursor: pointer;
                border-radius: 5px;
            }

            #joystick-handle {
                width: 50px;
                height: 50px;
                background-color: rgba(255, 255, 255, 0.8);
                border-radius: 50%;
                position: absolute;
                top: 25px;
                left: 25px;
                z-index: 1001;
                transition: transform 0.1s ease-out;
            }
        }
    </style>
</head>

<body>

    <canvas id="gameCanvas"></canvas>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="leaderboard"><h1>Leaderboard</h1></div>
    <div id="score"></div>
    <div id="joystick-base"></div>
    <div id="joystick-handle"></div>
    <div id="boost-button" class="mobile-only">BOOST</div>

    <div id="game-over-overlay">
        <div class="go-title">ELIMINATED</div>
        <div class="go-subtitle">You have been taken out of the game</div>
        <div class="go-score" id="go-score">Score: 0</div>
        <a href="game.html" class="go-btn go-btn-try">TRY AGAIN</a>
        <a href="index.html" class="go-btn go-btn-home">HOME</a>
        <a href="https://www.linkedin.com/in/muhammd-usman-0a07542b8/" target="_blank" class="go-btn go-btn-contact">CONTACT ME</a>
    </div>

    <script src="script.js"></script>
</body>

</html>

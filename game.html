<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Rajdhani', Arial, sans-serif;
            background: #0a0a0a;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        #minimap {
            position: fixed;
            bottom: 10px;
            right: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
        }

        #leaderboard {
            position: fixed;
            top: 20px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            min-width: 180px;
        }

        #leaderboard h1 {
            margin: 0 0 10px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #00e676;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }

        #score {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(0,230,118,0.5);
        }

        .mobile-only { display: none; }
        .button { display: none; }
        #joystick-base { display: none; }
        #joystick-handle { display: none; }

        /* ========== OVERLAY BASE ========== */
        .game-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            animation: overlayFadeIn 0.4s ease;
        }

        .game-overlay.active {
            display: flex;
        }

        .overlay-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, rgba(10,10,30,0.85) 0%, rgba(0,0,0,0.95) 100%);
        }

        .overlay-content {
            position: relative;
            z-index: 1;
            padding: 40px 60px;
            border-radius: 24px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            max-width: 440px;
            width: 90%;
        }

        /* ========== ANIMATIONS ========== */
        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes contentSlideIn {
            from { transform: scale(0.85) translateY(30px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 20px currentColor, 0 0 40px currentColor; }
            50% { text-shadow: 0 0 30px currentColor, 0 0 60px currentColor, 0 0 80px currentColor; }
        }

        @keyframes iconBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* ========== GAME OVER ========== */
        .go-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: iconBounce 1.2s ease-in-out infinite;
        }

        .go-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            color: #ff1744;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 6px;
            animation: glowPulse 2s ease-in-out infinite;
        }

        .go-subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 24px;
            letter-spacing: 1px;
        }

        .go-score-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,200,0,0.2);
            border-radius: 16px;
            padding: 16px 24px;
            margin-bottom: 28px;
        }

        .go-score-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.4);
            margin-bottom: 4px;
        }

        .go-score-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 48px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255,204,0,0.4);
        }

        .go-divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            margin: 0 auto 24px;
        }

        .overlay-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 36px;
            margin: 6px 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .overlay-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease;
        }

        .overlay-btn:hover::before {
            left: 100%;
        }

        .overlay-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .overlay-btn:active {
            transform: translateY(-1px);
        }

        .btn-retry {
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #003d19;
            box-shadow: 0 4px 15px rgba(0,200,83,0.3);
        }

        .btn-home {
            background: linear-gradient(135deg, #2962ff, #448aff);
            color: #fff;
            box-shadow: 0 4px 15px rgba(41,98,255,0.3);
        }

        .btn-contact {
            background: linear-gradient(135deg, #aa00ff, #d500f9);
            color: #fff;
            box-shadow: 0 4px 15px rgba(170,0,255,0.3);
            font-size: 13px;
            padding: 10px 28px;
            margin-top: 8px;
        }

        .btn-resume {
            background: linear-gradient(135deg, #00e676, #69f0ae);
            color: #003d19;
            box-shadow: 0 4px 15px rgba(0,230,118,0.3);
        }

        /* ========== PAUSE ========== */
        .pause-icon {
            font-size: 56px;
            margin-bottom: 14px;
            animation: iconBounce 1.5s ease-in-out infinite;
        }

        .pause-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #00e676;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 8px;
            animation: glowPulse 2s ease-in-out infinite;
        }

        .pause-hint {
            font-size: 14px;
            color: rgba(255,255,255,0.35);
            margin-top: 16px;
        }

        .pause-hint kbd {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
        }

        /* ========== RESPONSIVE ========== */
        @media only screen and (max-width: 600px) {
            #joystick-base {
                width: 100px;
                height: 100px;
                background-color: rgba(0, 0, 0, 0.5);
                border-radius: 50%;
                position: fixed;
                bottom: 20px;
                left: 20px;
                z-index: 1000;
            }
            .button {
                background-color: #4CAF50;
                border: none;
                color: white;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                margin: 4px 2px;
                cursor: pointer;
                border-radius: 5px;
            }
            #joystick-handle {
                width: 50px;
                height: 50px;
                background-color: rgba(255, 255, 255, 0.8);
                border-radius: 50%;
                position: absolute;
                top: 25px;
                left: 25px;
                z-index: 1001;
                transition: transform 0.1s ease-out;
            }
            .overlay-content { padding: 28px 24px; }
            .go-title { font-size: 30px; letter-spacing: 3px; }
            .go-score-value { font-size: 36px; }
            .pause-title { font-size: 28px; letter-spacing: 4px; }
        }
    </style>
</head>

<body>

    <canvas id="gameCanvas"></canvas>
    <canvas id="minimap" width="150" height="150"></canvas>
    <div id="leaderboard"><h1>Leaderboard</h1></div>
    <div id="score"></div>
    <div id="joystick-base"></div>
    <div id="joystick-handle"></div>
    <div id="boost-button" class="mobile-only">BOOST</div>

    <!-- GAME OVER OVERLAY -->
    <div id="game-over-overlay" class="game-overlay">
        <div class="overlay-bg"></div>
        <div class="overlay-content" style="animation: contentSlideIn 0.5s ease 0.1s both;">
            <div class="go-icon">💀</div>
            <div class="go-title">ELIMINATED</div>
            <div class="go-subtitle">Your snake has been destroyed</div>
            <div class="go-score-box">
                <div class="go-score-label">Final Score</div>
                <div class="go-score-value" id="go-score">0</div>
            </div>
            <div class="go-divider"></div>
            <div>
                <a href="game.html" class="overlay-btn btn-retry">⚔ Play Again</a>
                <a href="index.html" class="overlay-btn btn-home">🏠 Home</a>
            </div>
            <div>
                <a href="https://www.linkedin.com/in/muhammd-usman-0a07542b8/" target="_blank" class="overlay-btn btn-contact">✉ Contact Me</a>
            </div>
        </div>
    </div>

    <!-- PAUSE OVERLAY -->
    <div id="pause-overlay" class="game-overlay">
        <div class="overlay-bg"></div>
        <div class="overlay-content" style="animation: contentSlideIn 0.4s ease both;">
            <div class="pause-icon">⏸</div>
            <div class="pause-title">PAUSED</div>
            <div class="go-subtitle">Take a breather</div>
            <div class="go-divider"></div>
            <button id="resume-btn" class="overlay-btn btn-resume">▶ Resume</button>
            <div class="pause-hint">Press <kbd>ESC</kbd> to resume</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
